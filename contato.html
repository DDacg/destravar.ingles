<style>
:root {
  --navy:        #16243f;
  --navy-deep:   #101b30;
  --navy-line:   rgba(233, 223, 201, 0.14);
  --gold:        #c9a24a;
  --gold-bright: #ddb867;
  --gold-soft:   rgba(201, 162, 74, 0.14);
  --cream:       #f7f2ea;
  --paper-2:     #f1e9da;
  --ink:         #1b2536;
  --body:        #414c60;
  --body-navy:   #b9c3d4;
  --muted-navy:  #8f9bb2;
  --serif: "Fraunces", Georgia, "Times New Roman", serif;
  --sans:  "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--sans);
  color: var(--body-navy);
  background: var(--navy-deep);
  line-height: 1.65;
  font-size: 18px;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
a { color: inherit; }
::selection { background: var(--gold); color: var(--navy-deep); }

body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto 0;
  height: 4px;
  background: linear-gradient(90deg, var(--gold), var(--gold-bright) 55%, var(--gold));
  z-index: 100;
}

.contact { min-height: calc(100vh - 4px); display: grid; place-items: center; background: radial-gradient(120% 80% at 50% 0%, #1e3155 0%, var(--navy) 45%, var(--navy-deep) 100%); padding: 60px 24px; }
.contact-card { width: 100%; max-width: 540px; text-align: center; }

.eyebrow {
  font-family: var(--sans); font-weight: 800; font-size: 0.78rem;
  letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold-bright); margin: 0 0 16px;
}
.contact-card h1 { font-family: var(--serif); color: var(--cream); font-weight: 600; font-size: clamp(2rem, 5.5vw, 2.8rem); line-height: 1.08; letter-spacing: -0.015em; margin: 0 0 14px; }
.contact-card .lead { color: var(--body-navy); max-width: 40ch; margin: 0 auto 32px; font-size: 1.1rem; }

.contact-list { display: grid; gap: 14px; max-width: 440px; margin: 0 auto; text-align: left; }
.c-btn {
  display: flex; align-items: center; gap: 15px;
  padding: 16px 18px; border-radius: 14px; text-decoration: none;
  background: rgba(255,255,255,0.04); border: 1px solid var(--navy-line);
  transition: transform .15s ease, border-color .15s ease, background .15s ease;
}
.c-btn:hover { transform: translateY(-2px); border-color: rgba(201,162,74,0.5); background: rgba(201,162,74,0.07); }
.c-btn .ic { flex: none; width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; }
.c-btn .ic svg { display: block; }
.c-btn .txt { min-width: 0; }
.c-btn .txt b { display: block; color: var(--cream); font-size: 1.02rem; font-weight: 700; }
.c-btn .txt span { display: block; color: var(--muted-navy); font-size: 0.9rem; overflow-wrap: anywhere; }

.ic-wa { background: #25d366; color: #083d2a; }
.ic-mail { background: linear-gradient(180deg, var(--gold-bright), var(--gold)); color: var(--navy-deep); }
.ic-ig { background: linear-gradient(135deg, #f9ce34 0%, #ee2a7b 45%, #6228d7 100%); color: #fff; }

.contact-back { display: inline-block; margin-top: 30px; color: var(--gold-bright); text-decoration: none; font-size: 0.95rem; font-weight: 600; }
.contact-back:hover { text-decoration: underline; }
.contact-note { margin-top: 22px; font-size: 0.85rem; color: var(--muted-navy); }
</style>
